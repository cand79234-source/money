<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#2F6BFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>攒钱计划 v3</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#F1F3F8; --surface:#FFFFFF; --surface2:#F6F7FB; --line:#E4E8F0;
  --text:#151A23; --muted:#5B6474; --dim:#828B9B;
  --green:#0F9D58; --red:#DC3B41; --blue:#2F6BFF;
  --l1:#0284C7; --l2:#0D9488; --l3:#D97B06; --lg:#7C4DEE; --dream:#DB2777;
}
html,body{margin:0;padding:0;background:#E9EDF4;color:var(--text);
  font-family:system-ui,-apple-system,"PingFang SC","Helvetica Neue",sans-serif;
  font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body{display:flex;justify-content:center;min-height:100vh}
.phone{width:100%;max-width:430px;background:var(--bg);min-height:100vh;
  position:relative;display:flex;flex-direction:column;
  box-shadow:0 0 44px rgba(16,24,40,.10)}
main{flex:1;overflow-y:auto;padding:14px 14px 110px;-webkit-overflow-scrolling:touch}
main::-webkit-scrollbar{width:0}

.card{background:#FFFFFF;border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:12px;
  box-shadow:0 1px 2px rgba(16,24,40,.04),0 4px 14px rgba(16,24,40,.03)}
.sec{display:flex;align-items:center;justify-content:space-between;margin:22px 2px 0}
.sec h2{margin:0;font-size:14.5px;font-weight:640}
.sec .hint{font-size:11.5px;color:var(--dim)}
.tiny{font-size:11.5px} .muted{color:var(--muted)} .dim{color:var(--dim)}
.row{display:flex;align-items:center;gap:8px}
.between{display:flex;align-items:center;justify-content:space-between}
.money{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.btn{background:#FFFFFF;border:1px solid var(--line);color:var(--text);
  border-radius:10px;padding:8px 12px;font-size:13px;cursor:pointer;font-family:inherit}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(135deg,#2F6BFF,#5B8CFF);border-color:transparent;
  font-weight:600;color:#fff;box-shadow:0 2px 8px rgba(47,107,255,.28)}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 9px;font-size:12px;border-radius:8px}
.btn.danger{color:var(--red);border-color:rgba(220,59,65,.35)}
input,select,textarea{font-family:inherit;font-size:15px;color:var(--text);
  background:#FFFFFF;border:1px solid var(--line);border-radius:10px;padding:9px 11px;outline:none;width:100%}
input:focus,select:focus{border-color:#3B6BD6}
input[type=range]{-webkit-appearance:none;appearance:none;height:5px;border-radius:3px;padding:0;border:none;background:#E7EBF2}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;
  background:#fff;border:4px solid var(--accentC,#2F6BFF);cursor:pointer;box-shadow:0 1px 4px rgba(16,24,40,.22)}
.dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.pill{font-size:10.5px;padding:2px 7px;border-radius:6px;background:rgba(16,24,40,.055);color:var(--muted)}
.pill.salpct,.pill.salpctd{background:rgba(47,107,255,.10);color:#2F6BFF;font-weight:700}
.pill.g{background:rgba(15,157,88,.12);color:var(--green)}
.pill.r{background:rgba(220,59,65,.12);color:var(--red)}

/* ---- hero ---- */
.hero{margin-top:6px;border-radius:20px;padding:18px;border:1px solid #D9E2F8;
  background:linear-gradient(135deg,#E7EEFF 0%,#F4F7FF 62%);
  box-shadow:0 2px 12px rgba(47,107,255,.07)}
.hero .lbl{font-size:12px;color:var(--muted);letter-spacing:.5px}
.hero .big{font-size:33px;font-weight:700;margin:5px 0 2px;letter-spacing:-.5px}
.hero .big small{font-size:15px;font-weight:500;color:var(--dim)}
.bar{height:10px;border-radius:6px;background:#ECEFF5;overflow:hidden;margin:13px 0 7px;
  border:1px solid rgba(16,24,40,.04)}
.bar > i{display:block;height:100%;border-radius:6px;transition:width .5s cubic-bezier(.22,1,.36,1)}
.bar.sm{height:6px;margin:8px 0 6px}

/* ---- 薪资占比 ---- */
.split{display:flex;height:13px;border-radius:7px;overflow:hidden;margin:11px 0 9px;background:#ECEFF5}
.split i{display:block;height:100%;transition:width .4s}
/* 圆点/金额/百分比都不许被压缩，放不下就整块换行，绝不叠到隔壁圆点上 */
.legend{display:flex;flex-wrap:wrap;gap:5px 10px;margin-top:4px}
.legend span{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:4px;
  flex:0 0 auto;max-width:100%;white-space:nowrap}
.legend span i{flex:0 0 auto;margin-right:0}
.legend span b.money{flex:0 0 auto;font-size:11.5px}
.legend span b.pct{flex:0 0 auto;margin-left:0}
/* 百分比：加粗 + 上色，别再是浅灰小字 */
.pct{font-weight:700;color:var(--blue);font-variant-numeric:tabular-nums}
/* 下面这些选择器比 .pct 更具体，得单独顶回去 */
.legend span b.pct{font-weight:700}
.sub .si b.pct,.fold .fv b.pct{color:var(--blue);font-weight:700}
.al b{color:var(--blue);font-weight:700}
.legend span i{width:8px;height:8px;border-radius:3px;flex:0 0 auto}
.legend span b{color:var(--text);font-weight:620}
.arow{margin-bottom:13px}
.arow .dot{display:inline-block;vertical-align:middle}

/* ---- 级别卡 ---- */
.lv{background:#FFFFFF;border:1px solid var(--line);border-radius:16px;padding:13px;margin-top:10px;
  box-shadow:0 1px 2px rgba(16,24,40,.04),0 4px 14px rgba(16,24,40,.03)}
.lv .head{display:flex;align-items:center;gap:7px}
.lv .name{font-weight:640;font-size:14.5px}
.lv .amt{font-size:13px;color:var(--muted);margin-left:auto}
.lv .desc{font-size:11.5px;color:var(--dim);margin:4px 0 0}
.lv .foot{display:flex;align-items:center;gap:10px;margin-top:10px;
  padding-top:10px;border-top:1px dashed var(--line)}
.lv .foot .setlbl{font-size:12.5px;color:var(--muted);flex:1;min-width:0}
.lv .foot .setlbl b{color:var(--text);font-size:14px}
.adj{display:flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:9px;
  padding:5px 9px;font-size:12.5px;color:var(--muted);background:#F8FAFD;cursor:pointer;font-family:inherit}
.adj:active{background:#EFF3FA}

/* ---- 梦想 ---- */
.dream{border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:9px;background:#FBFCFE}
.dream .nm{font-weight:620;font-size:14px}
.track{position:relative;height:8px;border-radius:5px;background:#ECEFF5;margin:11px 0 15px;overflow:visible}
.track .fill{position:absolute;top:0;height:100%;border-radius:5px;background:var(--dream);opacity:.5;transition:width .5s}
.track .mark{position:absolute;top:-4px;width:2px;height:16px;background:#151A23;border-radius:2px;opacity:.7}
.track .now{position:absolute;top:-7px;width:10px;height:22px;border-radius:3px;
  background:var(--dream);box-shadow:0 0 0 2px #FFFFFF;transition:left .5s}

/* ---- 月份模块 ---- */
.mb{background:#FFFFFF;border:1px solid var(--line);border-radius:14px;margin-top:9px;overflow:hidden;
  box-shadow:0 1px 2px rgba(16,24,40,.04)}
.mb.on{border-color:#C7D7FF;box-shadow:0 2px 12px rgba(47,107,255,.10)}
.mh{display:flex;align-items:center;gap:9px;padding:13px;cursor:pointer}
.mh .mm{font-size:15px;font-weight:660;min-width:34px}
.mh .msum{flex:1;font-size:11.5px;color:var(--dim);text-align:right;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mh .msum b{color:var(--muted);font-weight:600}
.caret{width:16px;height:16px;flex:0 0 auto;color:var(--dim);transition:transform .22s}
.mb.on > .mh .caret{transform:rotate(180deg);color:var(--blue)}
.cpy{width:22px;height:22px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
  color:var(--dim);border:1px solid var(--line);border-radius:7px;background:#F8FAFC}
.cpy:active{background:#EDF1F8;color:var(--blue)}
.mbd{padding:0 13px 13px;border-top:1px solid var(--line)}
.mbd .fline{display:flex;align-items:center;gap:8px;padding:11px 0 4px}
.mbd .fline .fl{font-size:13px;font-weight:600}
.mbd .fline input{flex:1;text-align:right;padding:7px 10px}
.fold{display:flex;align-items:center;gap:7px;padding:10px 0 0;cursor:pointer}
.fold .ft{font-size:13px;font-weight:600}
.fold .fv{font-size:12px;color:var(--muted);margin-left:auto}
.fold .caret{width:14px;height:14px}
.fold.open .caret{transform:rotate(180deg)}

/* ---- 明细行 ---- */
.li{display:flex;align-items:center;gap:6px;padding:6px 0}
.li .tg{flex:0 0 auto;max-width:98px}
.li .tg select{padding:6px 6px;font-size:12.5px;background:#F4F7FC;border-radius:8px;
  border:1px solid transparent;color:var(--text)}
.li .am{position:relative;width:86px;flex:0 0 auto}
.li .am i{position:absolute;left:9px;top:50%;transform:translateY(-50%);font-style:normal;
  font-size:12px;color:var(--dim);pointer-events:none}
.li .am input{padding:7px 8px 7px 21px;font-size:13px;text-align:right}
.li .pc{width:34px;flex:0 0 auto;font-size:10.5px;font-weight:700;color:var(--blue);text-align:right;
  font-variant-numeric:tabular-nums}
.li .nt{flex:1;min-width:0}
.li .nt input{padding:7px 9px;font-size:12.5px}
.del{width:24px;height:24px;flex:0 0 auto;border:none;background:#F1F3F8;border-radius:7px;
  color:var(--dim);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.del:active{background:#E6E9F0}

/* ---- chips ---- */
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:8px 0 2px}
.chip{border:1px solid #DDE2EA;background:#FFFFFF;border-radius:8px;padding:5px 10px;
  font-size:12.5px;color:#374151;cursor:pointer;white-space:nowrap;border-left-width:3px}
.chip:active{background:#F2F5F9}
.chip.add{border-style:dashed;border-left-width:1px;color:var(--blue);background:#FAFCFF}
.chip.c0{border-left-color:#2563EB}
.chip.c1{border-left-color:#0F766E}
.chip.c2{border-left-color:#B45309}
.chip.c3{border-left-color:#6D28D9}
.chip.c4{border-left-color:#BE123C}
.tagx{margin-left:5px;color:var(--dim);font-size:13px;line-height:1;padding:2px 3px;cursor:pointer}
.tagx:active{color:var(--red)}

/* ---- 周 ---- */
.wk{display:flex;align-items:center;gap:7px;padding:6px 0}
.wkHit{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;
  color:var(--muted);background:rgba(47,107,255,.07);border:1px dashed rgba(47,107,255,.35);
  border-radius:10px;padding:7px 10px;margin:4px 0 2px}
.wkHit .hit{cursor:pointer;font-weight:600;white-space:nowrap}
.wkHit .dim{cursor:pointer;white-space:nowrap}
.wk .wl{width:64px;flex:0 0 auto}
.wk .wl b{display:block;font-size:12.5px;font-weight:600}
.wk .wl em{display:block;font-style:normal;font-size:10px;color:var(--dim);margin-top:1px}
.wk input.spent{width:80px;flex:0 0 auto;padding:7px 8px;font-size:13px;text-align:right}
.wk input.desc{flex:1;min-width:0;padding:7px 9px;font-size:12.5px}

/* ---- 词云 ---- */
.cloud{position:relative;overflow:hidden;padding:4px 2px 2px}
.cw{position:absolute;white-space:nowrap;cursor:pointer;line-height:1.1;font-weight:600;
  will-change:transform;animation:flt 7s ease-in-out infinite;transition:opacity .15s}
.cw:active{opacity:.5}
@keyframes flt{0%,100%{transform:translate(0,0)}50%{transform:translate(0,-6px)}}
.cloudTip{font-size:11px;color:var(--dim);margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}

/* ---- 分析 ---- */
.ana{background:#F8FAFC;border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-top:10px}
.ana .al{display:flex;gap:8px;font-size:12px;color:var(--muted);margin-bottom:7px;line-height:1.45}
.ana .al:last-child{margin-bottom:0}
.ana .al i{width:6px;height:6px;border-radius:50%;margin-top:6px;flex:0 0 auto;background:var(--dim)}
.ana .al.good i{background:var(--green)}
.ana .al.warn i{background:#D97706}
.ana .al.bad i{background:var(--red)}
.ana .al b{color:var(--blue);font-weight:700}

/* ---- 计算页 ---- */
.flow{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.flow .fn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.flow .fv{font-variant-numeric:tabular-nums;font-weight:600}
.flow .fp{min-width:46px;width:auto;text-align:right;font-size:11.5px;flex:0 0 auto;
  font-weight:700;color:var(--blue);font-variant-numeric:tabular-nums;white-space:nowrap}
.flow .fg{min-width:40px;width:auto;flex:0 0 auto;text-align:right}
.flow.minus .fv{color:var(--red)}
.flow.total{border-bottom:none;border-top:2px solid var(--line);margin-top:4px;padding-top:12px;font-size:15px}
.flow.total .fn{font-weight:700}
.flow.total .fv{font-weight:700;font-size:17px}
.sub{background:#F8FAFC;border-radius:10px;padding:2px 10px;margin:6px 0}
/* 生活费页「储蓄」栏：可点开/收起的 123长期 与 梦想项目 */
.flow.save{cursor:pointer}
.flow.save .fp{color:var(--blue)}
.flow.save .caret{transition:transform .22s}
.flow.save.collapsed .caret{transform:rotate(-90deg);color:var(--dim)}
.saveSub.collapsed{display:none}
.sub .si{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);padding:5px 0}
.sub .si b{color:var(--text);font-weight:600}
.flow.hl{background:#F1F5FB;border-radius:10px;padding:9px 10px;border-bottom:none;margin-top:9px}
.flow.hl .fn{color:var(--text);font-weight:620}
/* 圆点 名称 价格 */
.fixli{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);padding:4px 0}
.fixli:not(:last-child){border-bottom:1px solid rgba(148,163,184,.18)}
.fixli i{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
.fixli span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fixli b{color:var(--text);font-weight:620;font-family:var(--mono)}
/* 计算页「已给出」圆圈勾选按钮 */
.chk{width:22px;height:22px;flex:0 0 auto;border-radius:50%;border:1.5px solid #C7D0DE;
  background:#fff;color:#fff;display:flex;align-items:center;justify-content:center;
  cursor:pointer;padding:0;font-size:13px;line-height:1;transition:.15s;font-family:inherit}
.chk:active{transform:scale(.9)}
.chk.on{background:var(--green);border-color:var(--green)}
/* 一条「已给出」：变绿 + 名目划线，和没给的区分开 */
.fixli.paid{color:var(--green)}
.fixli.paid span{text-decoration:line-through;text-decoration-color:rgba(15,157,88,.55);color:#0E9F5E}
.fixli.paid i{background:var(--green)!important}
.fixli.paid b{color:var(--green)}
.fixli.paid .chk{border-color:var(--green)}
/* 浮动开销：独立区块，展开月份就能看见 */
.fxblock{margin-top:11px;padding:10px 11px 11px;border:1px solid var(--line);border-radius:12px;
  background:#FCFDFF}
.fxblock .bxhead{display:flex;align-items:center;gap:7px;margin-bottom:5px;flex-wrap:nowrap}
.fxblock .bxhead .tiny{white-space:nowrap}
/* 圆点 + 名目 + 金额 + 删，可直接写 */
.flexli{display:flex;align-items:center;gap:7px;padding:5px 0;font-size:13px}
.flexli:not(:last-child){border-bottom:1px solid rgba(148,163,184,.18)}
.flexli > i.fd{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
.flexli .fln{flex:1;min-width:0;padding:6px 8px;font-size:13px;font-weight:600;
  border:1px solid var(--line);border-radius:8px;background:#F8FAFD;color:var(--text)}
.flexli .am{flex:0 0 auto;display:flex;align-items:center;gap:3px}
.flexli .am em{font-style:normal;color:var(--dim);font-size:12px}
.flexli .am input{width:76px;flex:0 0 auto;text-align:right;padding:6px 7px;font-size:13px}
/* 弹窗里可编辑的「点 + 名称 + 钱」 */
.edli{display:flex;align-items:center;gap:9px;padding:7px 0;
  border-bottom:1px solid rgba(148,163,184,.18)}
.edli i{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.edli .nm{flex:1;min-width:0;font-size:13.5px;font-weight:600;color:var(--text);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.edli input{width:92px;flex:0 0 auto;text-align:right;padding:6px 9px;font-size:13.5px}
.edli .pctv{width:38px;flex:0 0 auto;text-align:right;font-size:11.5px}
.edHead{background:#F1F5FB;border-radius:11px;padding:10px 12px;margin-bottom:12px}
.edHead .r1{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.edHead .r1 b.big{font-size:21px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
.edTail{margin-top:12px;padding-top:10px;border-top:1px dashed var(--line)}
.edTail .r{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;
  color:var(--muted);padding:3px 0}
.edTail .r b{color:var(--text);font-weight:650;font-variant-numeric:tabular-nums}
.edTail .r.last b{font-size:16px;font-weight:700;color:var(--green)}
/* 梦想 foot 与 L1~L4 一样，同一行不折行 */
.dream .foot{display:flex;align-items:center;justify-content:space-between;gap:8px;
  margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);flex-wrap:nowrap}
.dream .foot .setlbl{font-size:12.5px;color:var(--muted);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.dream .foot .setlbl b{color:var(--text);font-size:14px}
.dream .foot .adj{flex:0 0 auto}
.lv .foot{flex-wrap:nowrap}
.lv .foot .adj{flex:0 0 auto}
.lv .foot .setlbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.want{display:flex;align-items:center;gap:8px;padding:7px 0;font-size:13px}
.want .wn{flex:1;min-width:0}
.want input{width:84px;flex:0 0 auto;text-align:right;padding:6px 8px;font-size:13px}
.want .wv{width:76px;flex:0 0 auto;text-align:right;font-size:12.5px;font-variant-numeric:tabular-nums}

/* ---- 债务 ---- */
.debt{padding:10px 0}
.debt + .debt{border-top:1px dashed var(--line)}
.dbars{height:7px;border-radius:4px;background:#ECEFF5;overflow:hidden;margin:7px 0 6px}
.dbars i{display:block;height:100%;background:linear-gradient(90deg,#DC3B41,#F59E0B);border-radius:4px}

/* ---- tabbar ---- */
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;
  display:flex;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);border-top:1px solid var(--line);
  padding:7px 0 max(7px,env(safe-area-inset-bottom));z-index:40;
  box-shadow:0 -1px 10px rgba(16,24,40,.05)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 0;
  cursor:pointer;color:var(--dim);font-size:10.5px;background:none;border:none;font-family:inherit}
.tab.on{color:var(--blue)}
.tab svg{width:21px;height:21px}

/* ---- 弹层 ---- */
.mask{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:60;display:none;
  align-items:flex-end;justify-content:center}
.mask.on{display:flex}
.sheet{width:100%;max-width:430px;background:#FFFFFF;border-radius:20px 20px 0 0;
  padding:16px 16px calc(20px + env(safe-area-inset-bottom));animation:up .22s ease}
@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.sh h3{margin:0;font-size:16px;font-weight:650}
.xbtn{width:30px;height:30px;border:1px solid var(--line);background:#F7F9FC;border-radius:9px;
  color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.fld{margin-bottom:11px}

<script>
/* ================= 常量 ================= */
const KEY='cuanqian.v8';
const LEVELS=[
  {k:'L1', n:'L1 波动金',   d:'低风险 · 衣柜添衣、家电坏了、临时想买 · 要攒但不计入总目标', target:2000,   c:'#0284C7', where:'余额'},
  {k:'L2', n:'L2 失业保底', d:'中风险 · 失业后约 6 个月薪资的安全垫',   target:20000,  c:'#0D9488', where:'余额宝.攒着'},
  {k:'L3', n:'L3 紧急医疗', d:'中高风险 · 家人住院、手术急需用钱',      target:30000,  c:'#D97B06', where:'余额宝.攒着'},
  {k:'LG', n:'长期存储',    d:'基本不动 · 真正的积蓄',                  target:450000, c:'#7C4DEE', where:'银行卡定存'}
];
const LEVEL_KEYS=LEVELS.map(l=>l.k);
/* 总目标只算 L2+L3+长期（2万+3万+45万=50万）；L1 波动金照样攒，但不占总目标额度 */
const BASE={L1:300,L2:900,L3:400,LG:400};
const GOAL_KEYS=['L2','L3','LG'];
const TOTAL_GOAL=500000;
/* 浮动开销的常用名目（不是每月都有的那种）。已并入标签库统一管理：
   首次启动会合并进 S.tags，之后就归标签库管，可以删。
   注意：这行必须在 normalize() 之前声明，否则会触发 TDZ 崩溃。 */
const FLEXTAGS=['人情','看病','修车','送礼','旅行','衣服','数码','维修','学习','罚款'];
/* 梦想基金的钱放在哪（想每个项目不一样，就把这里清空，再去 dreamSheet 加字段） */
const DREAM_WHERE='余额宝.可用';
const DAYS_PER_MONTH=30.44;
const WEEK_OPTS=[1,2,3,4,5];

/* 首次打开时的示例账目：上个月 + 本月，让词云和月份模块有东西可看 */
/* 示例月份数据（index8 起不再使用，留着只是万一想看样例） */
function defMonths_unused(){
  const d=new Date(), y=d.getFullYear(), m=d.getMonth()+1;
  const pm=m===1?12:m-1, py=m===1?y-1:y;
  const o={};
  o[py+'-'+pad(pm)]={total:2500,weeks:4,items:[
      {tag:'房租',amt:1200,note:''},{tag:'吃饭',amt:760,note:'外卖居多'},
      {tag:'交通',amt:210,note:''},{tag:'日用',amt:180,note:'超市'}],
    wdata:[{spent:180,desc:'周末聚餐'},{spent:140,desc:'电影'},{spent:90,desc:''},{spent:0,desc:''}]};
  o[y+'-'+pad(m)]={total:2500,weeks:4,items:[
      {tag:'房租',amt:1200,note:''},{tag:'吃饭',amt:520,note:''}],
    wdata:[{spent:260,desc:'超市 + 打车'},{spent:0,desc:''},{spent:0,desc:''},{spent:0,desc:''}]};
  return o;
}

/* index8 起：开局是干净的，不带任何示例数据。
   只保留三件「设定」：基准 2000、四档默认配比、满档溢出开着。 */
const defState=()=>({
  monthly:2000, alloc:{...BASE}, overflow:true,
  saved:{L1:0,L2:0,L3:0,LG:0},
  dreams:[],
  tags:['房租','吃饭','交通','日用','娱乐','人情','还款'],
  months:{},           // 没有任何历史月份，用到哪个月现建
  templates:[],
  debts:[],
  salary:0,            // 月薪资
  initial:{L1:0,L2:0,L3:0,LG:0},  // 开始前已有的积蓄，按四档分别记（已计入各档已攒与总目标）
  wbudget:{},          // 自定义周预算：{ '2026-09':[a,b,c,d] }
  calcM:0,             // 计算页选中的月份（只存 1~12，不存年份）
  booked:{},           // 已入账的月份：{ '2026-09':true }
  allocM:{},           // 每月各自的存储配比：{ '2026-09':{L1,L2,L3,LG} }，没设过的月份用全局 S.alloc
  monthlyM:{},         // 每月各自的存储基准：{ '2026-09':2000 }
  paid:{},             // 计算页「已给出」标记：{ '2026-09':{ 'fx:<id>':1, 'lv:L2':1, ... } }
  open:{}, fixOpen:{},
  view:'overview', curMonth:null
});

/* ================= 工具（全部声明完再 load） ================= */
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const money=n=>{n=Math.round(n);return (n<0?'-¥':'¥')+Math.abs(n).toLocaleString('zh-CN');};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function curKey(){const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1);}
function todayStr(){const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function parseD(s){const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c);}
function addDays(s,d){const t=parseD(s);t.setDate(t.getDate()+Math.round(d));
  return t.getFullYear()+'-'+pad(t.getMonth()+1)+'-'+pad(t.getDate());}
function diffDays(a,b){return Math.round((parseD(b)-parseD(a))/86400000);}
function fmtDate(s){const[a,b,c]=s.split('-');return a+'.'+b+'.'+c;}
function yearKey(){return (S.curMonth||curKey()).split('-')[0];}
function humanDays(d){d=Math.round(d);
  if(d<=0)return '已达成';
  if(d<365)return d+' 天';
  return Math.floor(d/365)+' 年';}
/* 比应投慢/快了多少，颗粒度细一点 */
function humanDelay(d){d=Math.round(d);
  if(d<30)return '延长 '+d+' 天';
  if(d<365)return '延长 '+Math.round(d/30.44)+' 个月';
  return '延长 '+(d/365).toFixed(1)+' 年';}
/* 数字输入统一去负号，免得填出负储蓄、负开销 */
function num(v,d){const n=parseFloat(v);return isNaN(n)?(d||0):Math.max(0,n);}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');
  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),1700);}
function getMonth(k){if(!S.months[k])S.months[k]={total:0,items:[],flex:[],weeks:4};return S.months[k];}

/* 这一档真正已攒的 = 之前累计攒的 + 开始前已有的（点总览右上角钱币填的初始金额） */
function savedOf(k){return (+S.saved[k]||0)+(+((S.initial||{})[k])||0);}

/* 满档溢出后的实际投入；alloc 可传「某个月自己的配比」，不传就用全局（长期基准） */
function effAlloc(alloc){
  const base={};LEVEL_KEYS.forEach(k=>base[k]=(alloc&&alloc[k]!=null)?alloc[k]:(S.alloc[k]||0));
  if(!S.overflow)return base;
  const out={};let pool=LEVEL_KEYS.reduce((s,k)=>s+base[k],0);
  for(const k of LEVEL_KEYS){
    const lv=LEVELS.find(x=>x.k===k);
    const gap=Math.max(0,lv.target-savedOf(k));
    if(gap<=0){out[k]=0;continue;}
    const give=Math.min(base[k],gap,pool);out[k]=give;pool-=give;
  }
  out.LG=(out.LG||0)+Math.max(0,pool);
  return out;
}
function monthSpent(k){const mo=getMonth(k);
  return (mo.items||[]).reduce((s,i)=>s+(+i.amt||0),0)
    +(mo.flex||[]).reduce((s,i)=>s+(+i.amt||0),0)
    +(mo.wdata||[]).reduce((s,w)=>s+(+w.spent||0),0);}
/* 只算「已给出」的：勾过的固定 / 浮动 + 每周实花。生活费页、结转、结余都用它 */
function monthSpentReal(k){const mo=getMonth(k);
  return (mo.items||[]).filter(i=>isPaid(k,'fx:'+i.id)).reduce((s,i)=>s+(+i.amt||0),0)
    +(mo.flex||[]).filter(i=>isPaid(k,'fl:'+i.id)).reduce((s,i)=>s+(+i.amt||0),0)
    +(mo.wdata||[]).reduce((s,w)=>s+(+w.spent||0),0);}
/* 每月各自的配比 / 基准：没单独设过就用全局长期基准 */
function monthAlloc(k){return (S.allocM&&S.allocM[k])?S.allocM[k]:S.alloc;}
function monthBase(k){return (S.monthlyM&&S.monthlyM[k]!=null)?S.monthlyM[k]:S.monthly;}
/* 计算页每行「已给出」状态：存在 S.paid[月份][key] */
function isPaid(mk,key){return !!(S.paid&&S.paid[mk]&&S.paid[mk][key]);}
function setPaid(mk,key,v){S.paid=S.paid||{};S.paid[mk]=S.paid[mk]||{};if(v)S.paid[mk][key]=1;else delete S.paid[mk][key];}
/* 存款类行（L1/L2/L3/长期、梦想）的「已给出」= 已存入 → 进总览；消费类（固定/浮动/负债）= 已花出 → 只进生活费页 */
function isDepositKey(key){return key.indexOf('lv:')===0||key.indexOf('dm:')===0;}
function depositLvKey(k){return 'lv:'+k;}
function depositDmKey(id){return 'dm:'+id;}
/* 某月某档「已存入」的目标金额：勾了「已给出」才算（存入九月会先把所有存款类行标绿，所以同样生效） */
function depositWantLevel(mk,k){
  return isPaid(mk,depositLvKey(k))?(effAlloc(monthAlloc(mk))[k]||0):0;}
function depositWantDream(mk,dm){
  return isPaid(mk,depositDmKey(dm.id))?(+dm.monthly||0):0;}
/* 幂等结算：把本月「已给出」的存款类行金额落到总览，与逐行勾选/整月入账保持一致，绝不重复记。
   用 mo.bookL / mo.bookD 记本月已应用金额，每次只补差额(delta)。 */
function reconcileDeposit(mk){
  const mo=getMonth(mk);mo.bookL=mo.bookL||{};
  LEVEL_KEYS.forEach(k=>{const w=depositWantLevel(mk,k),p=mo.bookL[k]||0,d=w-p;
    if(d!==0){S.saved[k]=(S.saved[k]||0)+d;mo.bookL[k]=w;}});
  mo.bookD=mo.bookD||{};
  (S.dreams||[]).forEach(dm=>{const w=depositWantDream(mk,dm),p=mo.bookD[dm.id]||0,dd=w-p;
    if(dd!==0){dm.saved=(dm.saved||0)+dd;mo.bookD[dm.id]=w;}});
}
function monthCalc(k){const mo=getMonth(k);
  const carryIn=+mo.carryIn||0,available=(+mo.total||0)+carryIn,spent=monthSpentReal(k);
  return{carryIn,available,spent,balance:available-spent};}
function rebuildCarry(){
  const y=yearKey();let prev=0;
  for(let m=1;m<=12;m++){
    const k=y+'-'+pad(m),mo=S.months[k];
    const blank=!mo||(!mo.total&&!(mo.items||[]).length&&!(mo.wdata||[]).length&&!(mo.flex||[]).length);
    if(blank){if(mo)mo.carryIn=prev;continue;}
    mo.carryIn=prev;prev=monthCalc(k).balance;
  }
}
/* 周预算：默认平分；有自定义就用自定义 */
function budgetOf(k,pool,wIdx,wk){
  const c=S.wbudget[k];
  if(c&&c.length===wk)return Math.max(0,+c[wIdx]||0);
  return wk>0?pool/wk:0;
}
/* 周预算文案：自定义了就优先显示「预算 X」；只有既没自定义、当月「可花」又为 0 时才「未设预算」。
   （老逻辑 pool<=0 就一律「未设预算」，会把已设的自定义周预算也吞掉，已修） */
function wkBudgetTxt(pool,bud){
  if(bud>0)return '预算 '+money(bud);
  if(pool<=0)return '<i class="dim">未设预算</i>';
  return '<i style="color:var(--red)">已超支</i>';
}
function copyText(t){
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t);
    else{const ta=document.createElement('textarea');ta.value=t;
      ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);
      ta.select();document.execCommand('copy');document.body.removeChild(ta);}
    toast('已复制，可以粘贴给 AI 分析');
  }catch(e){toast('复制失败，请手动选择');}
}
/* 标签使用频次，常用的排前面 */
function tagFreq(){
  const f={};
  Object.values(S.months).forEach(m=>
    [...(m.items||[]),...(m.flex||[])].forEach(it=>{
      const t=it.tag||'其他';f[t]=(f[t]||0)+1;}));
  S.tags.forEach(t=>{if(!f[t])f[t]=0;});
  return Object.entries(f).sort((a,b)=>b[1]-a[1]).map(x=>x[0]);
}
/* 某月的文本报告，用于复制给 AI */
function monthReport(k){
  rebuildCarry();
  const mo=getMonth(k),C=monthCalc(k),m=parseInt(k.split('-')[1],10);
  const items=mo.items||[];
  const fixSum=items.reduce((s,i)=>s+(+i.amt||0),0);
  const flexList=mo.flex||[];
  const flexSum=flexList.reduce((s,i)=>s+(+i.amt||0),0);
  const wk=mo.weeks||4;
  const pool=C.available-fixSum-flexSum;
  const sal=+S.salary||0;
  const pc=n=>C.available>0?(n/C.available*100).toFixed(1):'0';
  const pcs=n=>sal>0?(n/sal*100).toFixed(1):'—';
  let t=`【${m} 月账目】
`;
  t+=`月薪资 ${sal?money(sal):'未填'}
`;
  t+=`本月可用 ${money(C.available)}${C.carryIn?`（含上月结转 ${money(C.carryIn)}）`:''}
`;
  t+=`固定开销合计 ${money(fixSum)}（占可用 ${pc(fixSum)}%${sal?'，占薪资 '+pcs(fixSum)+'%':''}）
`;
  items.slice().sort((a,b)=>(+b.amt||0)-(+a.amt||0)).forEach(i=>{
    t+=`  - ${i.tag} ${money(+i.amt||0)}（占可用 ${pc(+i.amt||0)}%）${i.note?'  '+i.note:''}
`;});
  t+=`浮动开销合计 ${money(flexSum)}（占可用 ${pc(flexSum)}%${sal?'，占薪资 '+pcs(flexSum)+'%':''}）
`;
  flexList.slice().sort((a,b)=>(+b.amt||0)-(+a.amt||0)).forEach(i=>{
    t+=`  - ${i.tag} ${money(+i.amt||0)}（占可用 ${pc(+i.amt||0)}%）${i.note?'  '+i.note:''}
`;});
  t+=`周支出合计 ${money((mo.wdata||[]).reduce((s,w)=>s+(+w.spent||0),0))}（占可用 ${pc((mo.wdata||[]).reduce((s,w)=>s+(+w.spent||0),0))}%）
`;
  (mo.wdata||[]).slice(0,wk).forEach((w,i)=>{
    t+=`  第${i+1}周 预算 ${money(budgetOf(k,pool,i,wk))} / 实际 ${money(+w.spent||0)}${w.desc?' · '+w.desc:''}
`;});
  t+=`结余 ${money(C.balance)}${sal?'（占薪资 '+pcs(C.balance)+'%）':''}
`;
  if(S.debts.length){
    t+=`债务：
`;
    S.debts.forEach(d=>{const paid=Math.min(+d.total||0,(d.paid||0)*(+d.per||0));
      t+=`  - ${d.name} 每期 ${money(d.per)}，剩 ${money(Math.max(0,(+d.total||0)-paid))}
`;});
  }
  t+=`
请帮我分析哪些花销偏高、结构是否合理、怎么优化。`;
  return t;
}
/* 月份旁边的「分析 + 复制」弹窗 */
function reportSheet(k){
  const m=parseInt(k.split('-')[1],10);
  const rows=analyze(k);
  const txt=monthReport(k);
  sheet(`${sheetHead(m+' 月 · 系统分析')}
    <div class="ana" style="margin-top:0">${rows.length?rows.map(([c,t])=>
      `<div class="al ${c}"><i></i><span>${t}</span></div>`).join('')
      :'<div class="al"><i></i><span>这个月还没数据</span></div>'}</div>
    <div class="tiny muted" style="margin:13px 0 6px">下面这段可以直接粘给 AI</div>
    <textarea id="repTxt" readonly style="width:100%;height:150px;border:1px solid var(--line);
      border-radius:10px;padding:10px;font-size:11.5px;line-height:1.6;color:var(--muted);
      background:#F8FAFC;resize:vertical;font-family:inherit">${esc(txt)}</textarea>
    <div class="btns"><button class="btn" onclick="closeSheet()">关闭</button>
      <button class="btn primary" id="okRep">复制这段</button></div>`,()=>{
    $('#okRep').onclick=()=>copyText($('#repTxt').value);
  });
}
function dreamEta(d){
  const remain=Math.max(0,d.target-(d.saved||0));
  const pct=Math.min(100,(d.saved||0)/d.target*100);
  if(remain<=0)return{remain:0,date:todayStr(),delta:0,pct:100};
  const m=Math.max(0,d.monthly||0);
  if(m<=0)return{remain,date:null,delta:Infinity,pct};
  const days=Math.ceil(remain/m*DAYS_PER_MONTH);
  return{remain,date:addDays(todayStr(),days),delta:diffDays(d.deadline,addDays(todayStr(),days)),pct};
}

/* ---- 状态初始化 ---- */
const REMOTE_OK=()=>location.protocol.startsWith('http')&&!/github\.io$|^file:/.test(location.protocol+location.hostname);
let bootDone=false, pendingSync=false;
let S=load();
migrateBooked();
bootRemote();
function normalize(s){
  if(!s.curMonth)s.curMonth=curKey();
  /* 跨月自动推进：当前月排最前，并自动展开 */
  if(s.curMonth!==curKey()){
    const nk=curKey();
    s.open[nk]=true;s.fixOpen[nk]=true;
    s.curMonth=nk;
  }
  if(!s.months)s.months={};
  if(!s.debts)s.debts=[];
  if(!s.tags||!s.tags.length)s.tags=defState().tags;
  /* 标签统一：把写死的浮动名目并进标签库，只做一次。
     并进去之后就归标签库管 —— 你删掉它就不会再被加回来。 */
  if(!s.tagsMerged){FLEXTAGS.forEach(t=>{if(!s.tags.includes(t))s.tags.push(t);});s.tagsMerged=true;}
  if(!s.alloc)s.alloc={...BASE};
  if(!s.saved)s.saved={L1:0,L2:0,L3:0,LG:0};
  if(!s.initial)s.initial={L1:0,L2:0,L3:0,LG:0};
  if(!s.open)s.open={};
  if(!s.fixOpen)s.fixOpen={};
  if(!s.templates)s.templates=[];
  if(!s.dreams)s.dreams=[];
  if(!s.wbudget)s.wbudget={};
  if(!s.booked)s.booked={};
  if(!s.allocM)s.allocM={};
  if(!s.monthlyM)s.monthlyM={};
  if(!s.paid)s.paid={};
  if(!s.calcM)s.calcM=parseInt(curKey().split('-')[1],10);
  if(!Object.keys(s.open).length){s.open[s.curMonth]=true;s.fixOpen[s.curMonth]=true;}
  if(!s.fixOpen[s.curMonth])s.fixOpen[s.curMonth]=true;
  /* 给每笔固定 / 浮动开销补 id；老数据默认算「已给出」，免得从生活费页凭空消失 */
  Object.entries(s.months).forEach(([mk,mo])=>{
    ['items','flex'].forEach(arr=>{(mo[arr]||[]).forEach(i=>{
      if(i.id==null)i.id='i'+Math.random().toString(36).slice(2,9);
      if(i.paid==null){s.paid[mk]=s.paid[mk]||{};s.paid[mk][(arr==='items'?'fx':'fl')+':'+i.id]=1;}
      delete i.paid;});});
  });
  return s;
}

/* 老数据迁移：已在 S 初始化后跑。把「存入X月」过的月份，存款类行标绿并记下已应用金额
   （不重复加 S.saved，旧版 bookSave 已经把金额加进去了，这里只补 bookL/bookD 跟踪，避免日后重复记账） */
function migrateBooked(){
  Object.keys(S.booked||{}).forEach(mk=>{
    const mo=S.months[mk]; if(!mo)return;
    if(mo.bookL&&mo.bookD)return;
    const EF=effAlloc(monthAlloc(mk));
    mo.bookL=mo.bookL||{};
    LEVEL_KEYS.forEach(k=>{mo.bookL[k]=EF[k]||0;setPaid(mk,depositLvKey(k),true);});
    mo.bookD=mo.bookD||{};
    (S.dreams||[]).forEach(dm=>{mo.bookD[dm.id]=(+dm.monthly||0);setPaid(mk,depositDmKey(dm.id),true);});
  });
}

/* ---- 远程同步（可选：Neon/Postgres 后端，由 Render 托管） ---- */
async function syncRemote(){
  if(!REMOTE_OK())return;
  if(!bootDone){ pendingSync=true; return; }
  try{
    const res=await fetch('/api/state',{method:'POST',headers:{'content-type':'application/json'},
      body:JSON.stringify({data:S})});
    if(!res.ok){ console.warn('[sync] 保存远程状态失败：',res.status); pendingSync=true; return; }
    pendingSync=false;
  }catch(e){ console.warn('[sync] 保存远程状态失败（网络/后端不可用）：',e&&e.message||e); pendingSync=true; }
}
async function bootRemote(){
  if(!REMOTE_OK()){ bootDone=true; return; }
  let j=null;
  try{
    const get=async()=>{ const r=await fetch('/api/state'); if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); };
    try{ j=await get(); }
    catch(e){
      /* Render 免费版闲置后首次访问会冷启动（503），稍等再试一次 */
      await new Promise(r=>setTimeout(r,1500));
      j=await get();
    }
    if(j&&j.data){ S=normalize(j.data); render(); }
    /* 云端还是空的、但本机有货 → 把本机这份传上去（手机先开就自动上云，电脑再开就能看到） */
    else if(j&&!j.data&&hasLocalData()){ pendingSync=true; }
  }catch(e){ console.warn('[sync] 读取远程状态失败，沿用本地数据：',e&&e.message||e); }
  finally{ bootDone=true; if(pendingSync) syncRemote(); }
}
/* 本机是否有实质数据：避免空设备把空状态写上去，把有数据的那台覆盖掉 */
function hasLocalData(){
  if(+S.salary>0)return true;
  if(LEVEL_KEYS.some(k=>(+S.saved[k]||0)>0))return true;
  if((S.initial&&Object.values(S.initial).some(v=>+v>0)))return true;
  if(Object.keys(S.months||{}).length)return true;
  if((S.dreams||[]).length)return true;
  if((S.debts||[]).length)return true;
  return false;
}

/* 这个结构健不健康：攒钱 ≥20%、生活费 ≤50%、自由 ≥10% */
function healthOf(q){
  const P=n=>q.sal>0?Math.round(Math.max(0,n)/q.sal*100):0;
  const ps=P(q.save),pl=P(q.live),pf=P(Math.max(0,q.free));
  const out=[];
  if(ps>=30)out.push(['good',`攒钱 <b>${ps}%</b>，很猛（建议 20% 起）`]);
  else if(ps>=20)out.push(['good',`攒钱 <b>${ps}%</b>，达标`]);
  else if(ps>=10)out.push(['warn',`攒钱 <b>${ps}%</b>，偏少，往 20% 提`]);
  else out.push(['bad',`攒钱 <b>${ps}%</b>，基本没存下来`]);

  if(pl<=50)out.push(['good',`生活费 <b>${pl}%</b>，合理（建议不超过 50%）`]);
  else if(pl<=65)out.push(['warn',`生活费 <b>${pl}%</b>，偏高（建议压到 50% 以内）`]);
  else out.push(['bad',`生活费 <b>${pl}%</b>，吃掉大半薪资`]);

  if(q.free<0)out.push(['bad',`排不开：薪资比「攒钱 + 生活费」少 <b>${money(-q.free)}</b>`]);
  else if(pf>=25)out.push(['good',`还剩 <b>${money(q.free)}</b> 自由支配（${pf}%），宽裕`]);
  else if(pf>=10)out.push(['good',`还剩 <b>${money(q.free)}</b> 自由支配（${pf}%），够缓冲`]);
  else out.push(['warn',`只剩 <b>${money(q.free)}</b>（${pf}%）能自由支配，抗风险偏弱`]);

  const dreamSum=S.dreams.reduce((s,d)=>s+(+d.monthly||0),0);
  if(dreamSum>0)out.push(['',`梦想基金每月 <b>${money(dreamSum)}</b>（${P(dreamSum)}%）算消费，没计进储蓄`]);

  const bad=out.some(x=>x[0]==='bad'),warn=out.some(x=>x[0]==='warn');
  const verdict=bad?['bad','偏危险']:warn?['warn','有点紧']:['good','健康'];
  return{verdict,rows:out};
}

function distribute(o,k,val,total){
  val=Math.max(0,Math.min(total,Math.round(val)));
  const others=LEVEL_KEYS.filter(x=>x!==k);
  const rest=Math.max(0,total-val);
  const sum=others.reduce((s,x)=>s+(o[x]||0),0);
  if(sum<=0){const eq=Math.round(rest/others.length);others.forEach(x=>o[x]=eq);}
  else{let acc=0;others.forEach((x,i)=>{
    if(i===others.length-1)o[x]=Math.max(0,rest-acc);
    else{const v=Math.round((o[x]||0)/sum*rest);o[x]=v;acc+=v;}});}
  o[k]=val;
}

function monthlySheet(){
  const sal=+S.salary||0;
  /* 基准是长期标准；put 是这个月真正投进去的数，两者互不影响 */
  const ratio={};LEVEL_KEYS.forEach(x=>ratio[x]=S.alloc[x]||0);
  let base0=LEVEL_KEYS.reduce((s,x)=>s+ratio[x],0);
  /* 四档全是 0（比如上月投了 0）时回落到默认配比，不然钱会全砸进 L1 */
  if(!base0){LEVEL_KEYS.forEach(x=>ratio[x]=BASE[x]||0);
    base0=LEVEL_KEYS.reduce((s,x)=>s+ratio[x],0)||1;}
  let base=S.monthly||0, put=LEVEL_KEYS.reduce((s,x)=>s+(S.alloc[x]||0),0)||S.monthly||0;
  /* 四舍五入会有 1~2 元误差，补到占比最大的那一档，保证四档合计 === 输入的数 */
  const spread=n=>{
    const o={};let s=0;
    LEVEL_KEYS.forEach(k=>{o[k]=Math.round(ratio[k]/base0*n);s+=o[k];});
    if(s!==n){
      const big=LEVEL_KEYS.slice().sort((a,b)=>(ratio[b]||0)-(ratio[a]||0))[0];
      o[big]=Math.max(0,(o[big]||0)+(n-s));
    }
    return o;
  };
  const draw=()=>{
    const el=$('#mRows');if(!el)return;
    const v=spread(put);
    el.innerHTML=LEVELS.map(lv=>`
      <div class="arow" style="--accentC:${lv.c}">
        <div class="between" style="margin-bottom:0">
          <span class="tiny"><span class="dot" style="background:${lv.c};margin-right:5px"></span>${lv.n}</span>
          <span class="tiny"><b class="money" style="font-size:13.5px">${money(v[lv.k]||0)}</b>
            <span class="dim" style="margin-left:5px">${put>0?Math.round((v[lv.k]||0)/put*100):0}%</span></span>
        </div></div>`).join('')
      +`<div class="between tiny" style="margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)">
        <span class="dim">四档合计</span>
        <span><b class="money">${money(put)}</b>
          <span class="dim" style="margin-left:5px">/ 基准 ${money(base)}</span></span></div>`;
    const pc=$('#mPct');
    if(pc&&sal>0)pc.innerHTML=Math.round(put/sal*100)+'%';
  };
  sheet(`${sheetHead('每月存储')}
    <div class="f2">
      <div class="fld"><label>基准（长期，一般不动）</label>
        <input id="mBase" type="text" inputmode="decimal" class="money" value="${base}" step="100"></div>
      <div class="fld"><label>这个月投多少</label>
        <input id="mPut" type="text" inputmode="decimal" class="money" value="${put}" step="100"></div>
    </div>
    <div class="tiny dim" style="margin:9px 0 7px">改「这个月投多少」，四档按现在的比例自动分摊。
      ${sal>0?`占薪资 <b class="pct" id="mPct">${Math.round(put/sal*100)}%</b>`:''}</div>
    <div id="mRows"></div>
    <div class="btns"><button class="btn" onclick="closeSheet()">取消</button>
      <button class="btn primary" id="okM">确定</button></div>`,()=>{
    draw();
    $('#mPut').oninput=e=>{put=Math.max(0,parseFloat(e.target.value)||0);draw();};
    $('#mBase').oninput=e=>{base=Math.max(0,parseFloat(e.target.value)||0);draw();};
    $('#okM').onclick=()=>{
      base=Math.max(0,parseFloat($('#mBase').value)||0);
      put=Math.max(0,parseFloat($('#mPut').value)||0);
      const v=spread(put);
      S.monthly=base;LEVEL_KEYS.forEach(k=>S.alloc[k]=v[k]||0);
      save();closeSheet();render();toast('这个月投 '+money(put));};
  });
}

/* 自由浮动词云：从中心螺旋找位置，躲开已放好的词 */
function layoutCloud(){
  const box=document.querySelector('.cloud');if(!box)return;
  const W=box.clientWidth,H=box.clientHeight;
  if(!W||!H)return;
  const placed=[];
  box.querySelectorAll('.cw').forEach(el=>{
    const w=el.offsetWidth,h=el.offsetHeight;
    const cx=W/2,cy=H/2;
    let done=false;
    for(let t=0;t<3000&&!done;t++){
      const a=t*0.38,r=2+t*0.42;
      const x=cx+r*Math.cos(a)*1.75-w/2;
      const y=cy+r*Math.sin(a)*0.78-h/2;
      if(x<2||y<2||x+w>W-2||y+h>H-2)continue;
      const hit=placed.some(p=>!(x+w+7<p.x||x>p.x+p.w+7||y+h+5<p.y||y>p.y+p.h+5));
      if(!hit){placed.push({x,y,w,h});el.style.left=Math.round(x)+'px';
        el.style.top=Math.round(y)+'px';done=true;}
    }
    if(!done){ /* 挤不下就随便找个角落 */
      const x=Math.random()*Math.max(1,W-w-2),y=Math.random()*Math.max(1,H-h-2);
      placed.push({x,y,w,h});el.style.left=Math.round(x)+'px';el.style.top=Math.round(y)+'px';}
  });
}

        · ${pool>0?Math.round(spent/pool*100):0}%</span>
      <select class="wkSel" data-wk="${k}" style="width:auto;padding:5px 7px;font-size:12px">

    </div>`;
  for(let w=1;w<=wk;w++){
    const d=(mo.wdata||[])[w-1]||{};
    const bud=budgetOf(k,pool,w-1,wk);
    h+=`<div class="wk">
      <span class="wl"><b>第 ${w} 周</b><em>${wkBudgetTxt(pool,bud)}</em></span>

  h+=`</div>`;
  return h;
}

    wkBox.insertAdjacentElement('afterend',bar);

  document.querySelectorAll('[data-cpy]').forEach(el=>el.onclick=e=>{
    e.stopPropagation();reportSheet(y+'-'+pad(el.dataset.cpy));});

  });

  document.querySelectorAll('[data-quickdebt]').forEach(b=>b.onclick=()=>debtSheet(b.dataset.quickdebt,3000,500));
  document.querySelectorAll('[data-dpay]').forEach(b=>b.onclick=()=>{
    const d=S.debts[+b.dataset.dpay];if(!d)return;
    d.paid=(d.paid||0)+1;
    if(!S.tags.includes('还款'))S.tags.push('还款');
    const cmk=S.curMonth||curKey();
    const mo=getMonth(cmk);
    mo.items=mo.items||[];
    const id='i'+Math.random().toString(36).slice(2,9);
    mo.items.push({tag:'还款',amt:+d.per||0,note:d.name+' 第 '+d.paid+' 期',id});
    setPaid(cmk,'fx:'+id,true);
    save();render();toast('本期已还，已记入本月');});
  document.querySelectorAll('[data-ddel]').forEach(b=>b.onclick=()=>{
    S.debts.splice(+b.dataset.ddel,1);save();render();toast('已删除');});

/* ---- 周预算自定义 ---- */
function weekSheet(k){
  const mo=getMonth(k),C=monthCalc(k);
  const fixSum=(mo.items||[]).reduce((s,i)=>s+(+i.amt||0),0);
  const flexSum=(mo.flex||[]).reduce((s,i)=>s+(+i.amt||0),0);
  const pool=Math.max(0,C.available-fixSum-flexSum);
  const wk=mo.weeks||4;
  let arr=(S.wbudget[k]&&S.wbudget[k].length===wk)?[...S.wbudget[k]]
    :Array(wk).fill(Math.round(pool/wk));
  const draw=()=>{
    const box=$('#wkRows');if(!box)return;
    const drawSum=()=>{
      const used=arr.reduce((s,x)=>s+x,0);
      const left=pool-used;
      const sm=document.getElementById('wkSum');
      if(sm)sm.innerHTML=`<span class="dim">剩下可分配 / 可分配</span>
        <span style="color:${left<0?'var(--red)':'var(--muted)'}">${money(left)} / ${money(pool)}</span>`;
    };
    box.innerHTML=arr.map((v,i)=>`
      <div class="arow" style="display:flex;align-items:center;gap:9px;padding:8px 0;${i?'border-top:1px dashed var(--line)':''}">
        <span class="tiny" style="width:50px;flex:0 0 auto">第 ${i+1} 周</span>
        <input type="text" inputmode="decimal" class="wri" data-i="${i}" value="${v}" placeholder="0"
          style="flex:1;min-width:0;text-align:right;font-weight:600">
      </div>`).join('')+
      `<div class="between tiny" id="wkSum" style="margin-top:6px;padding-top:9px;border-top:1px dashed var(--line)">
        <span class="dim">剩下可分配 / 可分配</span>
        <span style="color:${pool-arr.reduce((s,x)=>s+x,0)<0?'var(--red)':'var(--muted)'}">${money(pool-arr.reduce((s,x)=>s+x,0))} / ${money(pool)}</span></div>`;
    box.querySelectorAll('.wri').forEach(r=>{
      r.onfocus=()=>r.select();
      r.oninput=()=>{
        const i=+r.dataset.i;arr[i]=num(r.value);
        drawSum();
      };
    });
  };
  sheet(`${sheetHead('调整每周预算')}
    <div class="tiny dim" style="margin-bottom:12px">可分配 ${money(pool)} · 直接填数字，想让哪周多花就填哪周</div>
    <div id="wkRows"></div>
    <div class="btns"><button class="btn" id="evenWk">平分</button>
      <button class="btn" onclick="closeSheet()">取消</button>
      <button class="btn primary" id="okWk">确定</button></div>`,()=>{
    draw();
    $('#evenWk').onclick=()=>{const eq=Math.round(pool/wk);arr=Array(wk).fill(eq);draw();};
    $('#okWk').onclick=()=>{S.wbudget[k]=arr;save();closeSheet();render();toast('周预算已更新');};
  });
}

/* ---- 系统分析 ---- */
function analyze(k,alloc){
  const mo=getMonth(k),C=monthCalc(k),sal=+S.salary||0;
  const items=mo.items||[];
  const fixSum=items.reduce((s,i)=>s+(+i.amt||0),0);
  const flexSum=(mo.flex||[]).reduce((s,i)=>s+(+i.amt||0),0);
  const EF=effAlloc(alloc),saveSum=LEVEL_KEYS.reduce((s,x)=>s+(EF[x]||0),0);
  const debtSum=S.debts.reduce((s,d)=>{
    const paid=Math.min(+d.total||0,(d.paid||0)*(+d.per||0));
    return s+(((+d.total||0)-paid)>0?(+d.per||0):0);},0);
  const free=sal-saveSum-fixSum-flexSum-debtSum;
  const P=n=>sal>0?Math.round(n/sal*100):0;
  const out=[];
  if(sal<=0){out.push(['','填上薪资才能分析占比']);}
  else{
    const r=P(saveSum);
    if(r>=30)out.push(['good',`攒钱占薪资 <b>${r}%</b>，很猛`]);
    else if(r>=20)out.push(['good',`攒钱占薪资 <b>${r}%</b>，达标（建议 20% 以上）`]);
    else if(r>=10)out.push(['warn',`攒钱只占薪资 <b>${r}%</b>，偏少，建议提到 20%`]);
    else out.push(['bad',`攒钱只占薪资 <b>${r}%</b>，基本没存下来`]);
    const sorted=items.slice().sort((a,b)=>(+b.amt||0)-(+a.amt||0));
    if(sorted.length){
      const top=sorted[0],tp=P(+top.amt||0),share=fixSum>0?Math.round((+top.amt||0)/fixSum*100):0;
      out.push([tp>35?'bad':tp>20?'warn':'good',
        `最大开销是「${esc(top.tag)}」${money(+top.amt||0)}，占薪资 <b>${tp}%</b>、占固定开销 <b>${share}%</b>${tp>35?'，明显偏高':''}`]);
    }
    const rent=items.find(i=>i.tag==='房租');
    if(rent){const rp=P(+rent.amt||0);
      out.push([rp>35?'bad':'good',`房租占薪资 <b>${rp}%</b>${rp>35?'，超过建议的 30% 了':''}`]);}
    if(flexSum>0)out.push(['',
      `浮动开销 ${money(flexSum)}（${P(flexSum)}%）也算了进去，这部分不是每月都有`]);
    if(free<0)out.push(['bad',`按这个花法每月倒挂 <b>${money(-free)}</b>：得少存点或砍开销`]);
    else out.push(['good',`扣完存储和两类开销，还剩 <b>${money(free)}</b> 自由支配（${P(free)}%）`]);
  }
  if(C.balance<0)out.push(['bad',`这个月已经超支 <b>${money(-C.balance)}</b>`]);
  if(debtSum>0)out.push(['warn',`本月要还 <b>${money(debtSum)}</b>，占薪资 ${P(debtSum)}%`]);
  return out;
}

/* 只存月份数字，年份永远取当年，跨年不会卡在去年 */
function calcKey(){return yearKey()+'-'+pad(+S.calcM||parseInt(curKey().split('-')[1],10));}

  rebuildCarry();
  const y=yearKey();
  const mk=calcKey(), m=+mk.split('-')[1];
  const mo=getMonth(mk),C=monthCalc(mk);
  const items=mo.items||[];
  const fixSum=items.reduce((s,i)=>s+(+i.amt||0),0);
  const flexList=mo.flex||[];
  const flexSum=flexList.reduce((s,i)=>s+(+i.amt||0),0);
  const EF=effAlloc(monthAlloc(mk)),saveSum=LEVEL_KEYS.reduce((s,x)=>s+(EF[x]||0),0);
  const debtList=S.debts.filter(d=>((+d.total||0)-Math.min(+d.total||0,(d.paid||0)*(+d.per||0)))>0);
  const debtSum=debtList.reduce((s,d)=>s+(+d.per||0),0);
  const sal=+S.salary||0;

/* ---- 存储总额 + 四档同屏调整（改了会同步到总览） ---- */
function saveSheet(){
  const mk=calcKey();
  const tmp={};LEVEL_KEYS.forEach(x=>tmp[x]=monthAlloc(mk)[x]||0);
  /* 记住进入弹窗时的比例，输多少就按这个比例摊，不会逐字缩成 0 */
  const ratio={};LEVEL_KEYS.forEach(x=>ratio[x]=tmp[x]);
  let base0=LEVEL_KEYS.reduce((s,x)=>s+ratio[x],0);
  if(!base0){LEVEL_KEYS.forEach(x=>ratio[x]=BASE[x]||0);
    base0=LEVEL_KEYS.reduce((s,x)=>s+ratio[x],0)||1;}
  let total=LEVEL_KEYS.reduce((s,x)=>s+tmp[x],0);
  const sal=+S.salary||0;
  const apply=n=>{
    let s=0;LEVEL_KEYS.forEach(k=>{tmp[k]=Math.round(ratio[k]/base0*n);s+=tmp[k];});
    if(s!==n){
      const big=LEVEL_KEYS.slice().sort((a,b)=>(ratio[b]||0)-(ratio[a]||0))[0];
      tmp[big]=Math.max(0,(tmp[big]||0)+(n-s));
    }
    total=LEVEL_KEYS.reduce((s,k)=>s+(tmp[k]||0),0);};
  const sync=()=>{LEVEL_KEYS.forEach(k=>ratio[k]=tmp[k]||0);
    base0=LEVEL_KEYS.reduce((s,x)=>s+ratio[x],0)||1;};
  const draw=()=>{
    const box=$('#svRows');if(!box)return;
    const used=LEVEL_KEYS.reduce((s,x)=>s+tmp[x],0);
    box.innerHTML=LEVELS.map(lv=>`
      <div class="arow" style="--accentC:${lv.c}">
        <div class="between" style="margin-bottom:6px">
          <span class="tiny"><span class="dot" style="background:${lv.c};margin-right:5px"></span>${lv.n}</span>
          <span class="tiny"><b class="money" style="font-size:14.5px">${money(tmp[lv.k]||0)}</b>
            <b class="pct" style="margin-left:5px">${total>0?Math.round((tmp[lv.k]||0)/total*100):0}%</b></span>
        </div>
        <input type="range" class="srl" data-k="${lv.k}" min="0" max="${Math.max(100,used)}" step="50" value="${tmp[lv.k]||0}">
      </div>`).join('')
      +`<div class="between tiny" style="margin-top:8px;padding-top:9px;border-top:1px dashed var(--line)">
        <span class="dim">合计</span>
        <span style="color:${used>total?'var(--red)':'var(--muted)'}">${money(used)} / ${money(total)}</span></div>`;
    const pc=$('#svPct');
    if(pc&&sal>0)pc.textContent=Math.round(used/sal*100)+'%';
    box.querySelectorAll('.srl').forEach(r=>r.oninput=()=>{
      distribute(tmp,r.dataset.k,+r.value,used||total);
      total=LEVEL_KEYS.reduce((s,k)=>s+(tmp[k]||0),0);
      sync();draw();});
  };
  const head=()=>{
    const el=$('#svHead');if(!el)return;
    const used=LEVEL_KEYS.reduce((s,x)=>s+tmp[x],0);
    el.innerHTML=`<div class="edHead">
      <div class="r1"><span class="tiny muted">这个月存多少</span>
        <input id="svTot" type="text" inputmode="decimal" class="money" value="${used||S.monthly||0}"
          style="width:118px;text-align:right;padding:5px 8px;font-size:17px;font-weight:700"></div>
      <div class="between tiny" style="margin-top:8px">
        <span class="dim">直接输入 · 基准 ${money(monthBase(mk))} 不变</span>
        <span class="dim">${sal>0?'占薪资 <b class="pct" id="svPct">'+Math.round(used/sal*100)+'%</b>':'填了薪资才看得到占比'}</span>
      </div></div>`;
    const t=$('#svTot');
    if(t)t.oninput=()=>{apply(Math.max(0,parseFloat(t.value)||0));draw();};
  };
  sheet(`${sheetHead('每月存储')}${''}
    <div id="svHead"></div>
    <div class="tiny" style="color:var(--muted);margin-bottom:7px">上面直接填这个月要存多少，四档按比例自动分摊；
      也可以单独拖某一档，其余三档自动让位</div>
    <div id="svRows"></div>
    <div class="btns"><button class="btn" onclick="closeSheet()">取消</button>
      <button class="btn primary" id="okSv">确定</button></div>`,()=>{
    head();draw();
    $('#okSv').onclick=()=>{
      apply(Math.max(0,parseFloat($('#svTot').value)||0));
      S.allocM=S.allocM||{};S.allocM[mk]={};LEVEL_KEYS.forEach(k=>S.allocM[mk][k]=tmp[k]||0);
      S.monthlyM=S.monthlyM||{};S.monthlyM[mk]=total;
      if(S.booked&&S.booked[mk])reconcileDeposit(mk);  /* 已入账月份：配比变了，总览差额跟着补 */
      save();closeSheet();render();
      toast(mk+' 月存 '+money(LEVEL_KEYS.reduce((s,k)=>s+(S.allocM[mk][k]||0),0))+'（仅本月，不影响其他月）');};
  });
}

/* ---- 开销编辑：一次性填完，上面看占比，下面看周均 ----
   kind = 'fix' 固定开销（mo.items） / 'flex' 浮动开销（mo.flex） ---- */
function fixEditSheet(k,kind,fromCalc){
  kind=kind||'fix';
  const isFix=kind==='fix', TITLE=isFix?'固定开销':'浮动开销';
  const mo=getMonth(k);
  const tmp=(isFix?(mo.items||[]):(mo.flex||[])).map(i=>{const id=i.id||('i'+Math.random().toString(36).slice(2,9));
    return{tag:i.tag,amt:+i.amt||0,note:i.note||'',id,paid:isPaid(k,(isFix?'fx':'fl')+':'+id)};});
  const other=(isFix?(mo.flex||[]):(mo.items||[])).reduce((s,i)=>s+(+i.amt||0),0);
  const m=parseInt(k.split('-')[1],10);
  const wk=mo.weeks||4;
  const calc=()=>{
    const EF=effAlloc(),saveSum=LEVEL_KEYS.reduce((s,x)=>s+(EF[x]||0),0);
    const dreamSum=S.dreams.reduce((s,d)=>s+(+d.monthly||0),0);
    const debtSum=S.debts.reduce((s,d)=>{
      const paid=Math.min(+d.total||0,(d.paid||0)*(+d.per||0));
      return s+(((+d.total||0)-paid)>0?(+d.per||0):0);},0);
    const live=(+S.salary||0)-saveSum-dreamSum-debtSum;
    const mine=tmp.reduce((s,i)=>s+i.amt,0);
    const all=mine+other;
    return{live,mine,all,left:live-all,perWk:wk>0?(live-all)/wk:0,
      pAll:live>0?Math.round(all/live*100):0,
      pSal:(+S.salary||0)>0?Math.round(all/(+S.salary)*100):0};
  };
  const draw=()=>{
    const box=$('#fxRows');if(!box)return;
    const c=calc(),sal=+S.salary||0;
    box.innerHTML=tmp.length?tmp.slice().sort((a,b)=>b.amt-a.amt).map(i=>{
      const n=tmp.indexOf(i);
      return `<div class="edli"><i style="background:${FIXC[n%FIXC.length]}"></i>
        <span class="nm">${esc(i.tag)}</span>
        <input type="text" inputmode="decimal" class="fmi" data-n="${n}" value="${i.amt||''}" placeholder="0">
        <button class="xbtn fmdel" data-n="${n}" style="width:24px;height:24px">
          <svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div>`;}).join('')
      :`<div class="empty" style="padding:10px 0">点下面的名目加进来，或者新建</div>`;
    const hd=$('#fxHead');
    if(hd)hd.innerHTML=`<div class="edHead">
      <div class="r1"><span class="tiny muted">${TITLE}合计</span><b class="big">${money(c.mine)}</b></div>
      <div class="tiny dim" style="margin-top:5px">两类开销共 <b class="money">${money(c.all)}</b>
        · 占本月生活费 <b class="pct">${c.pAll}%</b>${sal>0?` · 占薪资 <b class="pct">${c.pSal}%</b>`:''}</div></div>`;
    const tl=$('#fxTail');
    if(tl)tl.innerHTML=`<div class="edTail">
      <div class="r"><span>本月生活费</span><b>${money(c.live)}</b></div>
      <div class="r"><span>扣完固定 + 浮动</span><b style="color:${c.left<0?'var(--red)':''}">${money(c.left)}</b></div>
      <div class="r last"><span>每周能花（${wk} 周）</span><b style="color:${c.left<0?'var(--red)':''}">${money(c.perWk)}</b></div></div>`;
    box.querySelectorAll('.fmi').forEach(el=>{
      el.onfocus=()=>{if(!redrawing)el.select();};
      el.oninput=()=>{
        tmp[+el.dataset.n].amt=num(el.value);
        const end=el.value.length;draw();
        const nx=box.querySelector(`.fmi[data-n="${el.dataset.n}"]`);
        if(nx){redrawing=true;nx.focus();
          try{nx.setSelectionRange(end,end);}catch(e){}redrawing=false;}}});
    box.querySelectorAll('.fmdel').forEach(b=>b.onclick=()=>{
      tmp.splice(+b.dataset.n,1);draw();});
    document.querySelectorAll('#fxTags .chip').forEach(c=>c.onclick=()=>{
      tmp.push({tag:c.dataset.t,amt:0,note:'',id:'i'+Math.random().toString(36).slice(2,9),paid:fromCalc?false:true});draw();
      const all=box.querySelectorAll('.fmi'),last=all[all.length-1];
      if(last){redrawing=true;last.focus();redrawing=false;}});
  };
  sheet(`${sheetHead(m+' 月 · '+TITLE)}
    <div id="fxHead"></div>
    <div id="fxRows"></div>
    <div class="chips" id="fxTags" style="margin-top:10px">
      ${S.tags.map((t,i)=>
        `<span class="chip c${i%5}" data-t="${esc(t)}">+ ${esc(t)}</span>`).join('')}
      <span class="chip add" id="fxNew">+ 新名目</span>
    </div>
    <div id="fxTail"></div>
    <div class="btns"><button class="btn" onclick="closeSheet()">取消</button>
      <button class="btn primary" id="okFx">确定</button></div>`,()=>{
    draw();
    const nv=$('#fxNew');
    if(nv)nv.onclick=()=>{const n=prompt('开销名目',isFix?'水电':'人情');
      if(n==null||!n.trim())return;const t=n.trim();
      if(!S.tags.includes(t)){S.tags.push(t);save();render();}   /* 新名目自动进标签库并落盘，固定/浮动/生活费三处通用 */
      tmp.push({tag:t,amt:0,note:'',id:'i'+Math.random().toString(36).slice(2,9),paid:fromCalc?false:true});draw();};
    $('#okFx').onclick=()=>{
      if(isFix)mo.items=tmp.filter(i=>i.amt>0||i.tag);
      else mo.flex=tmp.filter(i=>i.amt>0||i.tag);
      tmp.forEach(i=>setPaid(k,(isFix?'fx':'fl')+':'+i.id, i.paid));
      save();closeSheet();render();toast(m+' 月'+TITLE+'已更新');};
  });
}

/* 调整本月：这个月实际花少了，把多出来的钱加进储蓄（L1~LG 已攒），手动微调 */
function adjustSheet(){
  const mk=calcKey(),m=parseInt(mk.split('-')[1],10);
  const draw=()=>{
    const box=$('#adjRows');if(!box)return;
    box.innerHTML=LEVELS.map(l=>`
      <div class="arow" style="--accentC:${l.c}">
        <div class="between" style="margin-bottom:6px">
          <span class="tiny"><span class="dot" style="background:${l.c};margin-right:5px"></span>${l.n}</span>
          <span class="tiny"><b class="money" style="font-size:13.5px">已攒 ${money(savedOf(l.k))}</b></span>
        </div>
        <div class="between tiny" style="margin-top:2px">
          <span class="dim">本月再攒</span>
          <input type="text" inputmode="decimal" class="adjIn" data-k="${l.k}" placeholder="0"
            style="width:110px;text-align:right;padding:6px 9px;font-size:13.5px"></div>
      </div>`).join('');
  };
  sheet(`${sheetHead('调整 · '+m+' 月储蓄')}
    <div class="tiny dim" style="margin-bottom:11px">这个月实际花少了，就把多出来的钱加进储蓄。各档填「本月再攒」多少，确认后累加到已攒。</div>
    <div id="adjRows"></div>
    <div class="btns"><button class="btn" onclick="closeSheet()">取消</button>
      <button class="btn primary" id="okAdj">确认调整</button></div>`,()=>{
    draw();
    $('#okAdj').onclick=()=>{
      LEVELS.forEach(l=>{const el=document.querySelector('[data-k="'+l.k+'"]');const v=num(el?el.value:0);
        if(v>0)S.saved[l.k]=(S.saved[l.k]||0)+v;});
      save();closeSheet();render();toast('已调整本月储蓄');};
  });
}

function bindCalc(){
  const mk=calcKey();
  const cs=$('#calcSal');
  if(cs)cs.oninput=()=>{S.salary=num(cs.value);save();renderFocus('#calcSal');};
  const cm=$('#calcMonth');
  if(cm)cm.onchange=()=>{S.calcM=+cm.value;save();render();};
  const ca=$('#calcAlloc');if(ca)ca.onclick=()=>saveSheet();
  const cd=$('#calcDream');if(cd)cd.onclick=()=>dreamEditSheet();
  const cf=$('#calcFix');if(cf)cf.onclick=()=>fixEditSheet(mk,'fix',true);
  const cfx=$('#calcFlex');if(cfx)cfx.onclick=()=>fixEditSheet(mk,'flex',true);
  const al=$('#applyLive');
  if(al)al.onclick=()=>{
    const mk=calcKey(),mo=getMonth(mk),r=calcLive(mk);
    mo.total=Math.round(r.live);
    const wk=mo.weeks||4;
    /* 用户自己调过周预算就别覆盖，那是有意为之 */
    const kept=Array.isArray(S.wbudget[mk])&&S.wbudget[mk].length===wk;
    if(!kept)S.wbudget[mk]=Array(wk).fill(Math.max(0,Math.round((r.live-r.fixSum-r.flexSum)/wk)));
    save();render();
    toast(`${parseInt(mk.split('-')[1],10)} 月已写入 ${money(mo.total)}${kept?' · 你调过的周预算保持原样':''}`);};
  const bs=$('#bookSave');
  if(bs)bs.onclick=()=>{
    const ck=calcKey();
    /* 一键把本月所有存款类行标绿（已给出）并结算进总览；幂等，重复点不重复记 */
    LEVEL_KEYS.forEach(k=>setPaid(ck,depositLvKey(k),true));
    (S.dreams||[]).forEach(dm=>setPaid(ck,depositDmKey(dm.id),true));
    reconcileDeposit(ck);
    S.booked=S.booked||{};S.booked[ck]=true;
    save();render();toast('本月存款已入账，总览已更新');};
  const am=$('#adjMonth');if(am)am.onclick=()=>adjustSheet();
  document.querySelectorAll('[data-paid]').forEach(b=>b.onclick=()=>{
    const key=b.dataset.paid, mk=calcKey();
    const now=!isPaid(mk,key);
    setPaid(mk,key,now);
    if(isDepositKey(key))reconcileDeposit(mk);   /* 存款类行：勾掉即入账 / 取消即冲回，总览随之更新 */
    save();render();
    toast(now?'这笔已给出 ✓':'已取消「已给出」');
  });
  document.querySelectorAll('[data-cwk]').forEach(b=>b.onclick=()=>{
    const mk=calcKey();
    sheet(`${sheetHead('生活费分几周')}
      <div class="chips">${WEEK_OPTS.map(n=>
        `<span class="chip" data-setwk="${n}">${n} 周</span>`).join('')}</div>
      <div class="tiny dim" style="margin-top:10px">想让哪周多花点？可以不平均分。</div>
      <button class="btn" id="goWkCustom" style="margin-top:8px;width:100%">自定义每周预算</button>`,()=>{
      document.querySelectorAll('[data-setwk]').forEach(c=>c.onclick=()=>{
        getMonth(mk).weeks=+c.dataset.setwk;save();closeSheet();render();});
      const gc=$('#goWkCustom');
      if(gc)gc.onclick=()=>weekSheet(mk);
    });});
}
function calcLive(mk){
  const mo=getMonth(mk);
  const fixSum=(mo.items||[]).reduce((s,i)=>s+(+i.amt||0),0);
  const flexSum=(mo.flex||[]).reduce((s,i)=>s+(+i.amt||0),0);
  const EF=effAlloc(monthAlloc(mk)),saveSum=LEVEL_KEYS.reduce((s,x)=>s+(EF[x]||0),0);
  const dreamSum=S.dreams.reduce((s,d)=>s+(+d.monthly||0),0);
  const debtSum=S.debts.reduce((s,d)=>{
    const paid=Math.min(+d.total||0,(d.paid||0)*(+d.per||0));
    return s+(((+d.total||0)-paid)>0?(+d.per||0):0);},0);
  const live=(+S.salary||0)-saveSum-dreamSum-debtSum;
  const wk=mo.weeks||4;
  return{live,perWk:wk>0?(live-fixSum-flexSum)/wk:0,wk,fixSum,flexSum,saveSum,dreamSum};
}


/* ---------------- 弹层 ---------------- */
function sheet(html,after){$('#sheet').innerHTML=html;$('#mask').classList.add('on');if(after)after();}
function closeSheet(){$('#mask').classList.remove('on');}
$('#mask').onclick=e=>{if(e.target.id==='mask')closeSheet();};
window.closeSheet=closeSheet;

window.onerror=(m,src,l)=>{
  const el=document.getElementById('main');
  if(el)el.innerHTML=`<div class="card" style="color:#DC3B41">页面出错了：${m}<br><span class="tiny dim">第 ${l} 行</span></div>`;
  return false;
};
render();

/* ---- PWA：注册 Service Worker，支持安装到桌面/主屏幕 ---- */
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  navigator.serviceWorker.register('/sw.js').catch(()=>{});
}
